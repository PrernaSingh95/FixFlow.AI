services:
  fixflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fixflow-ai:latest
    container_name: fixflow-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/fixflow.db
      - DUPLICATE_SIMILARITY_THRESHOLD=0.80
      - ENVIRONMENT=production
    volumes:
      - fixflow_data:/app/data

volumes:
  fixflow_data:
    driver: local
